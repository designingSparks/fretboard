<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <title>Dynamic Fretboard Diagram</title>
    <!-- 1. Include the GSAP library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        body {
            background-color: #fff;
            padding: 20px;
        }
        .fretboard-container {
            --heading-font-size: 24px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            line-height: 1.2;
            display: inline-block;
        }
        .fretboard-header {
            /* Normal flow - will push content below */
            padding-left: 60px; /* Align with nut area */
            display: flex;
            align-items: center;
            row-gap: 16px;
            column-gap: 64px; /* Horizontal spacing between the title and Triad playing box */
            max-width: calc(100vw - 56px);
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .fretboard-heading {
            flex: 0 0 auto;
        }
        .chord-panel {
            flex: 0 1 auto;
            min-inline-size: 0;
            max-width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 8px 12px 12px;
            border: 1px solid #b8c3cf;
            border-radius: 10px;
        }
        .chord-panel[hidden] {
            display: none;
        }
        .chord-label-title {
            padding: 0 6px;
            font-size: 14px;
            color: #666;
        }
        @media (max-width: 760px) {
            .fretboard-header {
                flex-wrap: wrap;
            }
            .fretboard-heading {
                flex: 0 1 auto;
                min-width: 0;
            }
        }
        .chord-labels {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 6.4px;
        }
        .chord-labels[hidden] {
            display: none;
        }
        .chord-label {
            display: inline-grid;
            place-items: center;
            align-content: start;
            row-gap: 2px;
            min-width: 48px;
            padding: 8px 11.2px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #333;
            font-family: inherit;
            font-size: var(--heading-font-size);
            font-weight: 400;
            line-height: 1.2;
            cursor: pointer;
        }
        .chord-label-main, .chord-label::after {
            grid-area: 1 / 1;
        }
        .chord-label-subtext, .chord-label[data-subtext]::before {
            grid-area: 2 / 1;
            font-size: 0.55em;
            line-height: 1.2;
            white-space: pre-wrap;
        }
        .chord-label[data-subtext]::before {
            /* Reserve the subtext's bold width as well as the main label's. */
            content: attr(data-subtext);
            font-weight: 700;
            visibility: hidden;
        }
        .chord-label::after {
            /* Reserve the bold width so selecting a chord never shifts its neighbours. */
            content: attr(data-label);
            font-weight: 700;
            visibility: hidden;
        }
        .chord-label:hover:not(:disabled):not(.selected) {
            background: #edf4fc;
        }
        .chord-label.selected {
            background: #1d65bf;
            color: #fff;
            font-weight: 700;
        }
        .chord-label:focus-visible {
            outline: 2px solid #1d65bf;
            outline-offset: 3px;
        }
        .chord-label.selected:focus-visible {
            /* The selected background already marks the keyboard target. */
            outline: none;
        }
        .chord-label:disabled {
            cursor: default;
            opacity: 1;
        }
        .fretboard-diagram {
            position: relative; /* Contain the absolutely positioned SVG */
            display: inline-block;
        }
        #string-svg-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; /* Place SVG strings between frets (z-index: 0) and notes (z-index: 2) */
        }
        #sequence-outline-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
            z-index: 1;
        }
        table {
            border-collapse: collapse;
            border-spacing: 0;
        }
        td, th {
            padding: 0;
            text-align: center;
            vertical-align: middle;
            height: 35px;
            min-width: 64px;
        }
        .fret {
             /* Using a gradient to simulate a wood grain texture */
             /* background: linear-gradient(to right, #8c5a41, #9d654b 50%, #8c5a41); */
             /* background: linear-gradient(to right, #9d654b, #8c5a41 50%, #9d654b); better */
             /* Using rgba to add an alpha channel, making the wood texture lighter */
             /* Light fretboard */
             /* Old brown background */
             /* background: linear-gradient(to right, rgba(209, 161, 99, 0.5), rgba(185, 134, 66, 0.5) 50%, rgba(209, 161, 99, 0.5)); */
             background-color: #fff;
        }
        .string-label {
            position: relative;
            background-color: #fff;
            color: #000;
            font-weight: bold;
            padding: 0 5px;
            min-width: 30px;
        }
        tfoot th {
            font-weight: normal;
            color: #666;
            padding-top: 5px;
        }
        .note, .open-string-note {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            position: relative; 
            z-index: 2;
        }
        .fret {
            /* border-right width sets fret width */
            border-right: 1px solid #525151;
            position: relative; 
        }
        tbody tr:first-child .fret {
            border-top: 1px solid #ccc;
        }
        tbody tr:last-child .fret {
            border-bottom: 1px solid #ccc;
        }
        .nut {
            /* border-left width sets nut width */
            border-left: 8px solid #333; 
        }

        /* Default highlight, no highlight1,2,3 added */
        .note, .open-string-note {
            background-color: #444; /* Default dark grey for all scale notes */
            color: #fff;
        }
        
        /* Default highlight, no highlight1,2,3 added 
           Because this rule comes LAST, it will take precedence. 
        */
        .note.inactive, .open-string-note.inactive {
            background-color: #bcbcbc; /* Inactive note colour */
            color: #000;
        }

        /* Highlight Group 1 (e.g., Root) */
        .note.highlight1, 
        .open-string-note.highlight1 {
            background-color: #e74c3c; /* Active (Red) */
            color: #fff;
        }
        .note.highlight1.inactive, 
        .open-string-note.highlight1.inactive {
            background-color: #fec1bb; /* Inactive (Faded Red) */
            color: #000;
        }
        /* Highlight Group 2 (e.g., Third) */
        .note.highlight2, 
        .open-string-note.highlight2 {
            background-color: #8e44ad; /* Active (Purple) */
            color: #fff; /* Text color for better contrast */
        }
        .note.highlight2.inactive, 
        .open-string-note.highlight2.inactive {
            background-color: #c39bd3; /* Inactive (Faded Purple) */
            color: #fff;
        }
        /* Highlight Group 3 (e.g., Fifth) */
        .note.highlight3, 
        .open-string-note.highlight3 {
            background-color: #3498db; /* Active (Blue) */
            color: #fff; /* Text color for better contrast */
        }
        .note.highlight3.inactive, 
        .open-string-note.highlight3.inactive {
            background-color: #aed6f1; /* Inactive (Faded Blue) */
            color: #fff;
        }

        /* Explicit background colors apply only while inactive. Active chord/root
           styles above take over temporarily without losing the layer color. */
        .note.background-colored.inactive, .open-string-note.background-colored.inactive {
            background-color: var(--background-note-color);
            color: var(--background-note-text);
        }
        .note.note-hidden, .open-string-note.note-hidden {
            visibility: hidden; /* Preserve marker geometry for sequence outlines. */
        }
        .open-string-label {
            position: absolute;
            inset: 0;
            align-content: center;
            text-align: center;
        }

        /* New class for the fret highlight */
        .highlighted-fret {
             background-color: #e8e8e8; /* Slightly darker grey for fret highlight */
        }

        /* --- Fret Marker Dots --- */
        .fret-marker-dot {
            position: absolute;
            width: 18px;
            height: 18px;
            /*background-color: #fcfbeb; /*cream*/
            /* background-color: #fff; White dots */
            background-color: #e3e3e3; /* lightgrey */
            border-radius: 50%;
            /* Center the dot horizontally within the fret cell */
            left: 50%;
            transform: translateX(-50%);
            z-index: 0; /* Lowest z-index to appear behind strings and notes */
        }

        /* --- Title and Subtitle --- */
        .fretboard-title {
            font-size: var(--heading-font-size);
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }
        .fretboard-subtitle {
            font-size: 16px;
            font-weight: 400;
            color: #666;
            margin-bottom: 0;
        }

    </style>
</head>
<body>

<div class="fretboard-container">
    <!-- Header section (normal flow) -->
    <div class="fretboard-header">
        <div class="fretboard-heading">
            <div class="fretboard-title"> </div>
            <div class="fretboard-subtitle"> </div>
        </div>
        <fieldset id="chord-panel" class="chord-panel" hidden>
            <legend id="chord-label-title" class="chord-label-title">Triad playing</legend>
            <div id="chord-labels" class="chord-labels" role="group" aria-label="Chord sequence" hidden></div>
        </fieldset>
    </div>

    <!-- Fretboard rendering area (isolated positioning) -->
    <div class="fretboard-diagram">
        <table id="fretboard-table">
            <tbody id="fretboard-body"></tbody>
            <tfoot id="fretboard-footer"></tfoot>
        </table>
        <!-- SVG container for strings. It will be populated by main.js -->
        <svg id="string-svg-container"></svg>
        <svg id="sequence-outline-container" aria-hidden="true"></svg>
    </div>
</div>

<script src="sequence_outlines.js"></script>
<script src="chord_labels.js"></script>
<script src="main.js"></script>

</body>
</html>
